
[project]
name = "insurance-agentic-suite"
version = "0.2.0"
description = "Insurance renewal agentic orchestrator and core tools"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "twilio",
  "google-api-python-client",
  "google-auth-httplib2",
  "google-auth-oauthlib",
  "jsonschema",
  "PyPDF2",
  "requests",
]

[tool.setuptools.packages.find]
where = ["src"]
